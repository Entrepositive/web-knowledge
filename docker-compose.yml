# web-knowledge — see README.md for install instructions.
#
# Optional settings, read from your shell environment or from a file named
# `.env` next to this one (that file holds ONLY these two settings — API keys
# live in data/config.env, written by setup):
#   WK_PORT  host port to publish on            (default 4242)
#   WK_BIND  host address to publish on         (default 127.0.0.1 = this machine only;
#                                                 0.0.0.0 = every network interface)
#
# To let another Docker Compose stack (e.g. n8n) reach this service by name,
# copy docker-compose.override.example.yml to docker-compose.override.yml
# and edit it — see README "Connecting other containers".

services:
  web-knowledge:
    build: .
    image: web-knowledge:local
    restart: unless-stopped
    environment:
      SEARXNG_URL: http://searxng:8080
    ports:
      - "${WK_BIND:-127.0.0.1}:${WK_PORT:-4242}:4242"
    volumes:
      # A directory, not individual files: Docker creates a missing directory
      # correctly, whereas a missing bind-mounted file becomes a directory.
      - ./data:/app/data
    networks:
      - internal

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - internal   # never published to the host

networks:
  internal:
    driver: bridge
